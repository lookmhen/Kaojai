services:
  kaojai:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:4000"
    env_file:
      - ./server/.env
    environment:
      - PORT=4000
      - NODE_ENV=production
    volumes:
      - ./server/data:/app/server/data
      - server_uploads:/app/server/public/uploads
    restart: always

volumes:
  server_uploads:
