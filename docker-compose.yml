services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    expose:
      - "4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - ./server/data:/app/data
      - server_uploads:/app/public/uploads
    restart: always

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - server
    restart: always

volumes:
  server_uploads:
