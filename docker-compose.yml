services:
  kaojai:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${HOST_PORT:-80}:4000"
    env_file:
      - path: ./server/.env
        required: false
    environment:
      - PORT=4000
      - NODE_ENV=production
    volumes:
      - ./server/data:/app/server/data
      - server_uploads:/app/server/public/uploads
    init: true
    restart: always

volumes:
  server_uploads:
